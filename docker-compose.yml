services:
  postgres:
    image: postgres:16-alpine
    container_name: mathify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mathify
      POSTGRES_PASSWORD: mathify_password
      POSTGRES_DB: mathify
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mathify-network

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: mathify-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mathify:mathify_password@postgres:5432/mathify?schema=public
      - NEXTAUTH_URL=http://localhost:3000
      - AUTH_TRUST_HOST=true
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - postgres
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - uploads:/app/uploads
    networks:
      - mathify-network

volumes:
  postgres_data:
  uploads:

networks:
  mathify-network:
    driver: bridge
